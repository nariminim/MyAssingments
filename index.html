<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>이나림 과제 모음</title>
    <style>
      /* 허브 페이지 자체는 스크롤/선택되지 않게 고정 (iOS에서 터치가 페이지 스크롤로 새는 것 방지) */
      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        font-family: sans-serif;
      }
      #menu {
        position: fixed;
        top: 0;
        left: 0;
        width: 100px;
        height: 100%;
        padding: 20px;
        box-sizing: border-box;
        background: #fff;
      }
      #menu a {
        display: block;
        margin-bottom: 10px;
        cursor: pointer;
        color: blue;
      }
      /* iframe을 감싸는 박스: 메뉴 영역만큼 왼쪽을 비우고 나머지 화면 전체를 차지 */
      #stage {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 100px;
        overflow: hidden;
      }
      #viewer {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="menu">
      <a onclick="loadHomework('Homework1')">Homework1</a>
      <a onclick="loadHomework('Homework2')">Homework2</a>
      <a onclick="loadHomework('Homework3')">Homework3</a>
      <a onclick="loadHomework('Homework4')">Homework4</a>
    </div>

    <div id="stage">
      <iframe id="viewer" src="Homework1/index.html"></iframe>
    </div>

    <script>
      function loadHomework(folderName) {
        document.getElementById("viewer").src = folderName + "/index.html";
      }
    </script>
  </body>
</html>
