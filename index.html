<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이나림 과제 모음</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        display: flex;
        height: 100vh;
      }
      #menu {
        width: 100px;
        padding: 20px;
        box-sizing: border-box;
      }
      #menu a {
        display: block;
        margin-bottom: 10px;
        cursor: pointer;
        color: blue;
      }
      #viewer {
        flex: 1;
        border: none;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="menu">
      <a onclick="loadHomework('Homework1')">Homework1</a>
      <a onclick="loadHomework('Homework2')">Homework2</a>
      <a onclick="loadHomework('Homework3')">Homework3</a>
      <a onclick="loadHomework('Homework4')">Homework4</a>
    </div>
    <iframe id="viewer" src="Homework1/index.html"></iframe>

    <script>
      function loadHomework(folderName) {
        document.getElementById("viewer").src = folderName + "/index.html";
      }
    </script>
  </body>
</html>
